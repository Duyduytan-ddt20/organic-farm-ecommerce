$kind: http-request
url: "{{baseUrl}}/api/v1/sales/dashboard"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{staffToken}}
scripts:
  - type: afterResponse
    code: pm.test('Staff bị 403', function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 5000
