$kind: http-request
url: "{{baseUrl}}/api/v1/staff/dashboard"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{customerToken}}
scripts:
  - type: afterResponse
    code: pm.test('Customer bị 403', function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 3000
