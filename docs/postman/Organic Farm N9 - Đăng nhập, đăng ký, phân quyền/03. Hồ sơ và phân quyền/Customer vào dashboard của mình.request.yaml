$kind: http-request
url: "{{baseUrl}}/api/v1/customer/dashboard"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{customerToken}}
scripts:
  - type: afterResponse
    code: pm.test('Customer 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 2000
