$kind: http-request
url: "{{baseUrl}}/api/v1/staff/dashboard"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{staffToken}}
scripts:
  - type: afterResponse
    code: pm.test('Staff 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000
