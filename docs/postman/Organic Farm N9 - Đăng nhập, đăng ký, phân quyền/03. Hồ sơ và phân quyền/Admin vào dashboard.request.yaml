$kind: http-request
url: "{{baseUrl}}/api/v1/admin/dashboard"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: pm.test('Admin 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 8000
