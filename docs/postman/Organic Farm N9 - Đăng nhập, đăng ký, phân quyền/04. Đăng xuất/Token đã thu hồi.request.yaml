$kind: http-request
url: "{{baseUrl}}/api/v1/auth/me"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: pm.test('Token thu hồi 401', function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 2000
