$kind: http-request
url: "{{baseUrl}}/api/v1/auth/logout"
method: POST
headers:
  Accept: application/json
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: pm.test('Logout 200', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 1000
