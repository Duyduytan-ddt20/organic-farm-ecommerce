$kind: http-request
url: "{{baseUrl}}/api/v1/customer/orders"
method: POST
body:
  type: json
  content: '{ "items": [] }'
auth:
  type: bearer
  credentials:
    token: "{{customerToken}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Bắt lỗi dữ liệu không hợp lệ (422)\", function () {\r

      \    pm.response.to.have.status(422);\r

      });"
    language: text/javascript
order: 3000
